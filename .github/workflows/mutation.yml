name: Mutation

# Nightly, not per-PR: the full `pnpm run mutation` sweep runs Stryker
# against every module in config/mutation/ (one isolated project per file,
# concurrency 1 each) — too slow to gate a PR on, but cheap to run while
# nobody's waiting so a mutation-score regression doesn't sit undetected
# until someone remembers to run it by hand.
#
# SHARDED (2026-09-13): ~200 configs on one runner ran past the 180-minute
# job timeout four nights running (2026-09-09→12) and every run ended
# "cancelled" — red on the dashboard's CI panel for days. Six matrix jobs
# each take every sixth config (`--shard i/6`, interleaved), so each
# finishes well inside the timeout and a real regression shows as one red
# shard, not a timeout.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation testing (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Actions are SHA-pinned per OpenSSF Scorecard "Pinned-Dependencies";
      # Dependabot's github-actions ecosystem keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack + pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Mutation testing (this shard's modules, 100% break threshold per config)
        # None of the 102 per-module vitest configs Stryker drives (config/mutation/
        # vitest.*.config.ts) set an explicit `reporters` list, so vitest's own default
        # resolution auto-adds a 'github-actions' reporter whenever GITHUB_ACTIONS=true —
        # and that reporter writes a job-summary chunk to $GITHUB_STEP_SUMMARY on EVERY
        # vitest invocation. Across a full sweep that's 100+ separate writes to the same
        # file, blowing past GitHub's 1024k step-summary cap and aborting the upload on
        # every nightly run (runs 32122624614, 32238617186). Reproduced directly: running
        # one mutation vitest config wrote a summary chunk with GITHUB_ACTIONS=true and
        # wrote nothing with it unset — this override is the fix, not a guess.
        run: pnpm run mutation -- --shard ${{ matrix.shard }}/6
        env:
          GITHUB_ACTIONS: false
