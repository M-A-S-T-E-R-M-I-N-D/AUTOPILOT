name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 30, not 20: windows-latest runs the full suite + coverage in ~20-25m
    # (observed 20m09s hitting the old cap exactly, 2026-09-03) — about twice
    # ubuntu's 12m; macos does it in 5m.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Actions are SHA-pinned per OpenSSF Scorecard "Pinned-Dependencies";
      # Dependabot's github-actions ecosystem keeps these current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack + pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Bundle size budget
        run: pnpm run ci:bundle-size

      - name: npx smoke test (dashboard bin, packed + installed standalone)
        run: pnpm run ci:npx-smoke-test

      - name: Test + coverage (>=80%)
        run: pnpm run test:coverage

      - name: Secret scan
        run: pnpm run ci:secret-scan

      - name: No personal paths
        run: pnpm run ci:no-personal-paths

      - name: Validate configs
        run: pnpm run ci:validate-configs

      - name: SPDX headers
        run: pnpm run ci:spdx

      - name: Dependency audit (production, high+ severity)
        run: pnpm run ci:dependency-audit

      - name: Architecture diagram matches the real package graph
        run: pnpm run ci:architecture

      - name: Citation metadata matches package.json/CHANGELOG.md
        run: pnpm run ci:citation

      - name: Every relative doc link resolves to a real file
        run: pnpm run ci:doc-links

      - name: DATA-MODEL.md matches the live schema
        run: pnpm run ci:data-model

      - name: CONTRAST-MATRIX.md matches the token themes
        run: pnpm run ci:contrast-matrix

      - name: THREAT-MODEL.md tool-grant table matches the real config
        run: pnpm run ci:threat-model

      - name: Quarantine list validation
        run: pnpm run ci:quarantine-report

  e2e:
    name: e2e (dashboard, real browser)
    # windows-latest, not the verify job's matrix: the checked-in Playwright
    # visual-regression baselines (apps/dashboard/e2e/*.spec.ts-snapshots/)
    # are only captured for chromium-win32 — running this on another OS would
    # fail on missing/mismatched baselines rather than a real regression.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack + pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # apps/dashboard/e2e drives a real Chromium against the compiled dashboard
      # (build + server), catching cross-lane bugs invisible to tsc and vitest —
      # e.g. a `.toString()`-embedded client function referencing a name that
      # only exists in its own module's scope, not the browser's.
      - name: e2e (build + real-browser suite)
        run: pnpm run e2e

      # Visual-baseline refresh loop: on a screenshot mismatch, Playwright
      # writes each test's -actual.png (this runner's own render) and
      # -diff.png under test-results/. Baselines captured on a DIFFERENT
      # Windows machine can differ from windows-latest by antialiasing alone,
      # so the canonical baselines are THIS runner's renders — after an
      # intentional UI change, download this artifact and commit its
      # *-actual.png files over the matching *.spec.ts-snapshots/ baselines.
      - name: Upload visual actuals + diffs (refresh-baseline artifact)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-visual-actuals
          path: apps/dashboard/test-results/
          retention-days: 7

  reuse-lint:
    name: reuse lint (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install reuse
        run: pip install reuse==6.2.0

      - name: REUSE Specification compliance (informational)
        run: reuse lint

  commitlint:
    name: commitlint (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack + pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate PR commit messages
        run: >
          pnpm commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  doc-commit-refs:
    name: doc commit-SHA citations are reachable from HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Needs full history: git merge-base --is-ancestor can only confirm a
      # real ancestor of HEAD if it was actually fetched — the default
      # shallow checkout would false-fail every legitimately old citation,
      # which is why this is its own job rather than chained into "verify"
      # (same reasoning as the commitlint job above).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # No `pnpm install` on purpose: the scan is a single dependency-free
      # script, and `pnpm run` only needs the manifest to resolve the alias
      # the gate census pins (ci-workflow-gate.test.ts).
      - name: Check doc commit-SHA citations resolve to real HEAD ancestors
        run: pnpm run ci:doc-commit-refs
          --verbose
